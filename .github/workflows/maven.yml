# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # NOTE: Build and WebUI Testing - Selenium Cucumber BDD Tests        
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      
    - name: Run Tests, Publish Report, & Capture URL 🎣
      id: publish_report1
      run: |
        # 1. Run your Maven command that generates the report (e.g., test execution).
        # You may need to replace 'mvn clean test...' with the specific command 
        # that ALSO triggers the cucumber report publishing.
        REPORT_OUTPUT=$(mvn clean test -Dtest=apiAutomation | tee /dev/stderr)
        
        # 2. Extract the dynamic URL from the command output.
        # This command searches the output for the specific URL pattern and takes the last one.
        REPORT_URL=$(echo "$REPORT_OUTPUT" | grep 'https://reports.cucumber.io/reports/' | tail -n 1)
        
        # 3. Check if the URL was found and make it available as a step output.
        if [ -z "$REPORT_URL" ]; then
          echo "WARNING: Cucumber live report URL was not found in the output."
          # Set a default/empty value if not found
          echo "report_url=" >> "$GITHUB_OUTPUT"
        else
          echo "Captured URL: $REPORT_URL"
          # Set the captured URL as an output variable for the next step
          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"
        fi
      # Continue even if the test or publishing command fails, so we can capture the output
      if: always()    

    - name: Display Live Report Link in Summary 📄
      uses: actions/github-script@v7
      with:
        script: |
          // Retrieve the URL captured in the previous step's output
          const reportUrl = process.env.REPORT_URL;
          
          if (reportUrl) {
            core.summary.addHeading('Cucumber Live Report Link 🔗', 2)
              .addRaw('The interactive external report for this run is available:')
              // Use addLink to create a clickable URL in the summary
              .addLink('View Dynamic Cucumber Report', reportUrl)
              .write();
          } else {
            core.summary.addRaw('⚠️ **Cucumber Report Publishing Failed:** Could not find the dynamic report URL. Check the previous step logs.')
              .write();
          }
      env:
        # Pass the captured URL from Step 1's output to this script
        REPORT_URL: ${{ steps.publish_report1.outputs.report_url }}
      # Ensure this runs to update the summary, even if the report wasn't generated
      if: always()
      
    # NOTE: 'mvn clean test' runs the test goal, which also does the package goal implicitly.
    - name: Run API test only
      # This step generates the reports in the 'target' directory.
      run: mvn clean test -Dtest=apiAutomation -DexcludeTests=RunCucumberTest
   
    - name: Verify Target Directory Contents 🔍
      # Use the 'find' command to recursively search for the file, 
      # starting from the project root (where the target folder is).
      # Run this step even if the tests fail.
      run: |
        echo "Searching for spark.html in the project directory..."
        find . -name "spark.html" || true
        echo "Listing contents of target directory:"
        ls -R target/ || true
      if: always()

    # ⬇️ Upload the Extent Report Artifact
    - name: Upload Extent Reports (spark.html) 🚀
      uses: actions/upload-artifact@v4
      with:
        name: Extent-Spark-Report
        # **FIXED PATH**: Use the exact file path or directory.
        # This assumes the file is generated directly in the 'target' folder.
        # If your report has accompanying CSS/JS/Image files, use 'target/' or 'target/your_report_dir/'
        path: target/spark.html 
        retention-days: 7
      
      # ***CRITICAL FIX***: Ensures report uploads even if tests fail
      if: always() 
      
    # ⬇️ Upload Cucumber Report (Cleaned up the path and logic)
    - name: Upload Cucumber Report
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report
        # Using a relative path is safer in GitHub Actions
        path: target/cucumber-reports/ # Assuming the reports are in this directory
        retention-days: 7
      if: always()

    # ⬇️ Upload SureFire Report (Cleaned up the path and logic)
    - name: Upload SureFire Report
      uses: actions/upload-artifact@v4
      with:
        name: surefire-report
        # Using a relative path is safer in GitHub Actions
        path: 
          # target/surefire-reports/**/*
          target/surefire-reports/Surefire suite/Surefire test.html # Assuming the reports are in this directory
        retention-days: 7
      if: always()
      
    - name: Publish Report & Write URL to File 📝
      id: publish_report
      run: |
        # Capture the dynamic URL (adjust grep/tail command as needed)
        REPORT_URL=$(mvn cucumber-reporting:publish | grep 'https://reports.cucumber.io/reports/' | tail -n 1)
        
        # Write the URL to a text file in the target directory
        echo "$REPORT_URL" > target/cucumber_live_report_link.html
      if: always()      

    - name: Upload Report Link Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cucumber-Live-Link
        path: target/cucumber_live_report_link.html
        retention-days: 7
      if: always()
